<!DOCTYPE html>
<html>
  <head>
    <title>Cadastro de Pessoa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% load static %}

    <link
      rel="icon"
      type="image/x-icon"
      href="{% static '/images/faviconATENA.png' %}"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f7f7f7;
      }

      form {
        margin: 20px;
      }

      input[type="text"],
      input[type="email"] {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button[type="submit"] {
        padding: 8px 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      h2 {
        color: #333;
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Cadastro de Pessoa</h1>
    <form method="POST">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">Cadastrar</button>
    </form>
  </body>
</html>
